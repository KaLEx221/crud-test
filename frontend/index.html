<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Test</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>User CRUD</h1>

    <form id="userForm">
        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <button type="submit">Add User</button>
    </form>

    <h2>Users</h2>

    <div id="usersList"></div>

    <script src="script.js"></script>

</body>
</html>
